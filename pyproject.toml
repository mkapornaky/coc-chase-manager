[project]
name = "coc-chase-manager"
version = "0.1.0"
description = "Keeper-side chase tracker for Call of Cthulhu 7th edition"
requires-python = ">=3.12"
dependencies = ["nicegui"]

[project.optional-dependencies]
native = ["pywebview"]  # NiceGUI native mode backend

[project.scripts]
chase-manager = "coc_chase.ui:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "coc_chase"
